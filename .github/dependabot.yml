version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - javascript
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - react
          - react-dom
    ignore:
      # TypeScript 7 removed the `baseUrl` option, which @docusaurus/tsconfig
      # still ships. Stay on TS 6.x until Docusaurus drops baseUrl from its
      # shared tsconfig, then remove this entry and take the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
